<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estacionamento Park Fácil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5" style="max-width: 480px;">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white text-center">
                <h1 class="h4 mb-0">ESTACIONAMENTO PARK FÁCIL</h1>
            </div>
            <div class="card-body">
                <form action="calcular.php" method="post">

                    <div class="mb-3">
                        <label for="horas" class="form-label">Horas estacionado</label>
                        <input type="number" class="form-control" name="horas" id="horas" min="1" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label d-block">Veículo</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="veiculo" id="carro" value="0" required>
                            <label class="form-check-label" for="carro">Carro</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="veiculo" id="moto" value="1">
                            <label class="form-check-label" for="moto">Moto</label>
                        </div>
                    </div>

                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" name="lavagem" id="lavagem">
                        <label class="form-check-label" for="lavagem">Lavagem</label>
                    </div>

                    <div class="d-flex gap-2">
                        <input type="submit" class="btn btn-primary" value="Calcular">
                        <input type="reset" class="btn btn-outline-secondary" value="Limpar">
                    </div>

                </form>
            </div>
        </div>
    </div>
</body>
</html>
